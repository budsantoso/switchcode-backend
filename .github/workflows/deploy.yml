name: Deploy Laravel Backend (ZIP Fast Mode)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build ZIP & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, fileinfo, zip
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Prepare Production .env
        run: |
          cat << 'EOF' > .env
          APP_NAME="Switch Code API"
          APP_ENV=production
          APP_KEY=base64:XG8o9UfK70Z+mF3F2o/UjL10mQO8q2L4a8t4y0o1a8w=
          APP_DEBUG=false
          APP_URL=https://api.switchcode.id

          APP_LOCALE=id
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=id_ID

          APP_MAINTENANCE_DRIVER=file

          BCRYPT_ROUNDS=12

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=public
          QUEUE_CONNECTION=database

          CACHE_STORE=database
          CACHE_PREFIX=

          EOF
          php artisan key:generate --force

      - name: Create Release Package
        run: |
          mkdir -p dist/public
          # Compress whole project ke dist/public/release.zip
          zip -q -r dist/public/release.zip . -x ".git/*" ".github/*" "tests/*" "dist/*"
          cp public/deploy_unzip.php dist/public/deploy_unzip.php
          cp public/artisan_runner.php dist/public/artisan_runner.php

      - name: Upload Package via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /public_html/api.switchcode.id/

      - name: Trigger Remote Unzip & Bootstrap
        run: |
          curl -s -f "http://api.switchcode.id/deploy_unzip.php?key=SwitchCodeDeploy2026SecretKey" || curl -s "https://api.switchcode.id/deploy_unzip.php?key=SwitchCodeDeploy2026SecretKey"
          curl -s "http://api.switchcode.id/artisan_runner.php?key=SwitchCodeDeploy2026SecretKey&cmd=migrate:fresh"
          curl -s "http://api.switchcode.id/artisan_runner.php?key=SwitchCodeDeploy2026SecretKey&cmd=storage:link"
